<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Continuum Memorials</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page-shell">

    <div class="brand">
      Continuum Memorials
    </div>

    <div id="status" class="status">
      Loading memorial…
    </div>

    <article id="memorial" class="memorial" hidden>

      <div id="message" class="memorial-message"></div>

      <div class="permanence">
        Permanently recorded on the Bitcoin network
      </div>

      <a
        id="verify-link"
        class="verify-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Verify on Bitcoin →
      </a>

    </article>

  </main>

  <script src="memorial.js"></script>

</body>
</html>
